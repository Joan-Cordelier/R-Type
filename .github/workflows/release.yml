name: Release
on:
  push:
    branches: 
      - dev  # Only trigger on main branch pushes

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      upload_url:      ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: rp
        with:
          release-type: simple

  build-and-attach:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
    steps:
      - uses: actions/checkout@v4
      
      - name: Create vcpkg binary cache directory
        run: mkdir -p ${{ github.workspace }}/vcpkg_cache

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-binary-${{ runner.os }}-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build curl zip unzip tar \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libwayland-dev libxkbcommon-dev

      - name: Setup and bootstrap vcpkg
        run: |
          if [ ! -d "vcpkg/.git" ]; then
            rm -rf vcpkg
            git clone https://github.com/microsoft/vcpkg.git
          fi
          if [ ! -f vcpkg/vcpkg ]; then
            ./vcpkg/bootstrap-vcpkg.sh
          fi
      
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake
      
      - name: Build
        run: cmake --build build --config Release
      
      - name: Package binaries (Linux)
        run: |
          mkdir -p release
          cp build/r-type_server release/
          cp build/r-type_client release/
          cp -r yaml release/
          cp -r data release/ 2>/dev/null || true
          cp -r textures release/ 2>/dev/null || true
          tar -czf r-type-linux.tar.gz -C release .
      
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: r-type-linux.tar.gz
          tag_name: ${{ needs.release.outputs.tag_name }}

