name: Release
on:
  push:
    branches: 
      - main  # Only trigger on main branch pushes

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      upload_url:      ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: rp
        with:
          release-type: simple

  build-and-attach:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build curl zip unzip tar
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
      
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake
      
      - name: Build
        run: cmake --build build --config Release
      
      - name: Package binaries (Linux)
        run: |
          mkdir -p release
          cp build/r-type_server release/r-type_server
          cp build/r-type_client release/r-type_client
          tar -czf r-type-linux.tar.gz -C release .
      
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: r-type-linux.tar.gz
          tag_name: ${{ needs.release.outputs.tag_name }}
